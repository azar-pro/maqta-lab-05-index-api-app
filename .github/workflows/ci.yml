name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Install dependencies
        run: npm install
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Open Library live smoke signal
        continue-on-error: true
        run: curl --retry 2 --retry-delay 2 --max-time 12 --fail --silent --show-error 'https://openlibrary.org/search.json?q=design&limit=1' >/dev/null
      - name: Upload verified production bundle
        uses: actions/upload-artifact@v4
        with:
          name: index-production
          path: dist
          if-no-files-found: error
      - name: Install browser QA driver
        run: npm install --no-save puppeteer-core@latest
      - name: Browser QA
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist >/tmp/index-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME_BIN=/usr/bin/google-chrome QA_BASE_URL=http://127.0.0.1:4173/ node .github/scripts/browser-qa.mjs
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: index-browser-qa
          path: qa
          if-no-files-found: warn
      - name: Publish verified dist branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/index-dist
          cp -R dist/. /tmp/index-dist/
          cp qa/screenshots/01-discover-desktop.png /tmp/index-dist/portfolio-preview.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dist
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/index-dist/. .
          touch .nojekyll
          git add -A
          git commit -m "deploy: verified production bundle ${GITHUB_SHA}"
          git push --force origin dist
